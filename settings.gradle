import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "llamaimage"
include(":app")

// -PsdPrebuiltNative=true (build-local.sh): package CI-built .so files from app/src/main/jniLibs
// instead of compiling native code, so the variant modules are not needed.
if (!providers.gradleProperty("sdPrebuiltNative").getOrElse("false").toBoolean()) {
    include(":sdjni-fp16")
    include(":sdjni-gpu")
}
