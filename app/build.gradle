plugins {
    id 'com.android.application'
}

// -PsdPrebuiltNative=true (used by build-local.sh): skip the NDK build and package the CI-built
// .so files placed in src/main/jniLibs. Normal builds compile them (CI) and ignore that folder.
def prebuiltNative = providers.gradleProperty("sdPrebuiltNative").getOrElse("false").toBoolean()

android {
    namespace "com.micklab.llamaimage"
    compileSdk 35

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.micklab.llamaimage"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        // Baseline armv8-a library (libsd_jni.so). The fp16+dotprod variant is built by :sdjni-fp16.
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                targets "sd_jni"
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // The engine's libraries carry hundreds of MB of DWARF (RelWithDebInfo); bundling it as
            // native debug metadata ran the release build out of Java heap in CI. Not needed here.
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!prebuiltNative) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = prebuiltNative ? ['src/main/jniLibs'] : []
        }
    }

    ndkVersion "27.2.12479018"

    // Compress the (16KB-page-aligned) libsd_jni*.so in the APK and extract them at install.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // The Khronos ICD loader is built only to LINK libsd_jni_gpu.so; at runtime the
            // device's vendor libOpenCL.so must be used, so never ship the loader.
            excludes += ['**/libOpenCL.so']
            // NPU (QNN HTP via ONNX Runtime): only the HTP backend is used — drop the Qualcomm DSP
            // (V66) and GPU backends that qnn-runtime also ships.
            excludes += ['**/libQnnDsp.so', '**/libQnnDspV66Skel.so', '**/libQnnDspV66Stub.so', '**/libQnnGpu.so']
        }
    }
}

dependencies {
    // NPU backend: ONNX Runtime (MIT) with the QNN execution provider; pulls
    // com.qualcomm.qti:qnn-runtime (QTI AI Stack License — redistributable as part of this app).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android-qnn:1.29.0'
    if (!prebuiltNative) {
        implementation project(':sdjni-fp16')
        implementation project(':sdjni-gpu')
    }
}
