plugins {
    id 'com.android.application'
}

// -PsdPrebuiltNative=true (used by build-local.sh): skip the NDK build and package the CI-built
// .so files placed in src/main/jniLibs. Normal builds compile them (CI) and ignore that folder.
def prebuiltNative = providers.gradleProperty("sdPrebuiltNative").getOrElse("false").toBoolean()

android {
    namespace "com.micklab.llamaimage"
    compileSdk 35

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.micklab.llamaimage"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        // Baseline armv8-a library (libsd_jni.so). The fp16+dotprod variant is built by :sdjni-fp16.
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                targets "sd_jni"
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!prebuiltNative) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = prebuiltNative ? ['src/main/jniLibs'] : []
        }
    }

    ndkVersion "27.2.12479018"

    // Compress the (16KB-page-aligned) libsd_jni*.so in the APK and extract them at install.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    if (!prebuiltNative) {
        implementation project(':sdjni-fp16')
    }
}
