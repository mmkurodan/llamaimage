plugins {
    id 'com.android.library'
}

// Native-only module: builds the SAME sources as :app (app/src/main/cpp/CMakeLists.txt) with
// SD_CPU_VARIANT=fp16 (-march=armv8.2-a+fp16+dotprod) into libsd_jni_fp16.so. The app loads it on
// CPUs whose /proc/cpuinfo reports asimdhp + asimddp (see CpuInfo.nativeLibraryCandidates) and
// keeps the armv8-a baseline libsd_jni.so for older cores. A separate module = a separate CMake
// build tree, which is how one CMakeLists can be compiled twice with different flags.
android {
    namespace "com.micklab.llamaimage.sdjni.fp16"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        minSdk 24

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON", "-DSD_CPU_VARIANT=fp16"
                targets "sd_jni_fp16"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../app/src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
