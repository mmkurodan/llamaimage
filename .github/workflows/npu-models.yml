name: NPU models (ONNX export)

# 手動実行、または NPU スクリプト変更時。DreamShaper 8 LCM + TAESD を NPU (ONNX Runtime QNN EP) 用の静的形状 ONNX に
# 書き出し、CPU の参照パイプラインで画像が正しく出ることを確かめて成果物にする。
on:
  workflow_dispatch:
  # workflow_dispatch only works once this file is on the default branch; until then (and when the
  # export changes) run on pushes that touch it.
  push:
    paths:
      - 'scripts/npu/**'
      - '.github/workflows/npu-models.yml'

permissions:
  contents: write   # publish the models as a GitHub Release (npu-models-v1)

env:
  NPU_RELEASE_TAG: npu-models-v1

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Install
        run: pip install -r scripts/npu/requirements.txt

      - name: Export ONNX
        run: python scripts/npu/export_onnx.py --out npu-models

      - name: Reference pipeline (CPU)
        run: python scripts/npu/reference_pipeline.py --models npu-models --out npu-ref

      # On-device conversion: weightless templates + weight maps, checked against the export.
      - name: Templates + device-equivalent assembly (DreamShaper 8 LCM, byte-verified)
        run: |
          set -e
          CK=$(python -c "from huggingface_hub import hf_hub_download as d; print(d('Lykon/dreamshaper-8-lcm','DreamShaper8_LCM.safetensors',revision='4645d8bc6a8e6b106d21606d63e8460cdad4f1a6'))")
          python scripts/npu/make_template.py --models npu-models --checkpoint "$CK" --out npu-templates
          python scripts/npu/assemble.py --templates npu-templates --checkpoint "$CK" --out asm-ds --verify npu-models --run
          rm -rf asm-ds

      - name: Assembly from another SD1.5 checkpoint (AbsoluteReality LCM) + reference image
        run: |
          set -e
          curl -fsSL -o ar_lcm.safetensors "https://civitai.com/api/download/models/256668?fileId=199166"
          echo "0501f9c30cf36a777f0e3722e497b8cc5e8d9fde839e2459b80621e02f8ed98d  ar_lcm.safetensors" | sha256sum -c
          python scripts/npu/assemble.py --templates npu-templates --checkpoint ar_lcm.safetensors --out asm-ar --run
          cp -r npu-models/taesd_*.onnx npu-models/tokenizer npu-models/scheduler_config.json asm-ar/
          python scripts/npu/reference_pipeline.py --models asm-ar --out npu-ref/absolutereality \
            --prompt "portrait photo of a young woman in a cafe, natural window light"
          rm -rf asm-ar ar_lcm.safetensors

      # The app's Java NPU code (app/src/main/java/.../npu) on a JVM with the ORT CPU provider.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Java NPU pipeline test (tokenizer golden, Java assembly == Python assembly, images)
        run: |
          set -e
          mkdir -p jt/lib jt/assets jt/classes
          curl -fsSL -o jt/lib/onnxruntime.jar https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.32.0/onnxruntime-1.32.0.jar
          curl -fsSL -o jt/lib/json.jar https://repo1.maven.org/maven2/org/json/json/20260814/json-20260814.jar
          cp npu-templates/* npu-models/taesd_*.onnx jt/assets/
          cp npu-models/tokenizer/vocab.json jt/assets/tokenizer_vocab.json
          cp npu-models/tokenizer/merges.txt jt/assets/tokenizer_merges.txt
          python - <<'PY'
          import json
          from transformers import CLIPTokenizer
          t = CLIPTokenizer("npu-models/tokenizer/vocab.json", "npu-models/tokenizer/merges.txt")
          prompts = ["a photo of a cat sitting on a wooden table, soft light", "", "Hello,   WORLD!!  it's 2026 :-)",
                     "masterpiece, best quality, 1girl, (colorful),(delicate eyes and face), 8k wallpaper",
                     "日本の桜と富士山 sunset", "emoji 🐱🎨 test", "don't we'll they're I'm you've she'd",
                     " ".join(["very long prompt"] * 40), "a-b_c/d\\e [f] {g} <h> |i| 3.14159 1,000"]
          json.dump({p: t(p, padding="max_length", max_length=77, truncation=True).input_ids for p in prompts},
                    open("jt/tokens.json", "w"), ensure_ascii=False)
          PY
          CK=$(python -c "from huggingface_hub import hf_hub_download as d; print(d('Lykon/dreamshaper-8-lcm','DreamShaper8_LCM.safetensors',revision='4645d8bc6a8e6b106d21606d63e8460cdad4f1a6'))")
          javac -d jt/classes -cp "jt/lib/*" $(find app/src/main/java/com/micklab/llamaimage/npu scripts/npu/java-test -name '*.java')
          java -Xmx6g -cp "jt/classes:jt/lib/*" com.micklab.llamaimage.npu.NpuJavaTest jt/assets "$CK" jt/tokens.json npu-ref/java
          python scripts/npu/assemble.py --templates npu-templates --checkpoint "$CK" --out jt/py
          for f in text_encoder.weights unet.weights; do
            a=$(sha256sum npu-ref/java/model/$f | cut -d' ' -f1); b=$(sha256sum jt/py/$f | cut -d' ' -f1)
            echo "$f java=$a python=$b"; [ "$a" = "$b" ]
          done
          rm -rf npu-ref/java/model jt/py

      - name: Diagnose (ONNX vs PyTorch fp32, diffusers reference images)
        run: python scripts/npu/diagnose.py --models npu-models --out npu-ref

      - name: Sizes
        run: ls -la npu-models npu-models/tokenizer npu-ref

      # Release assets are flat files: tokenizer/* -> tokenizer_*. Licenses travel with the models
      # (CreativeML OpenRAIL-M for DreamShaper 8 LCM incl. its use restrictions, MIT for TAESD).
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release
          cp npu-models/*.onnx npu-models/scheduler_config.json npu-models/SOURCES.json release/
          cp npu-templates/*.template.onnx npu-templates/*.map.json release/   # on-device conversion
          cp npu-models/tokenizer/vocab.json release/tokenizer_vocab.json
          cp npu-models/tokenizer/merges.txt release/tokenizer_merges.txt
          curl -fsSL https://huggingface.co/spaces/CompVis/stable-diffusion-license/raw/main/license.txt \
            -o release/LICENSE-DreamShaper8-LCM-CreativeML-OpenRAIL-M.txt
          curl -fsSL https://raw.githubusercontent.com/madebyollin/taesd/main/LICENSE -o release/LICENSE-TAESD-MIT.txt
          cat > release/README.txt <<'EOF'
          NPU models for llamaimage (ONNX Runtime QNN execution provider, Hexagon HTP).
          DreamShaper 8 LCM by Lykon (https://huggingface.co/Lykon/dreamshaper-8-lcm), converted to ONNX
          (static 512x512, fp16 weights, float32 I/O). License: CreativeML OpenRAIL-M — the use-based
          restrictions in Attachment A apply to these converted files and to all outputs.
          TAESD by Ollin Boer Bohan (https://huggingface.co/madebyollin/taesd), MIT License.
          Exact sources/revisions: SOURCES.json. Checksums: SHA256SUMS.
          EOF
          sed -i 's/^          //' release/README.txt
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release; cat release/SHA256SUMS

      # Published once per tag; delete the release to republish (the app pins size + SHA-256).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$NPU_RELEASE_TAG" > /dev/null 2>&1; then
            echo "release $NPU_RELEASE_TAG exists — not republishing"; exit 0
          fi
          gh release create "$NPU_RELEASE_TAG" release/* --target "$GITHUB_SHA" --prerelease \
            --title "NPU models v1: DreamShaper 8 LCM + TAESD (ONNX, 512px)" \
            --notes-file release/README.txt

      - name: Upload reference images
        uses: actions/upload-artifact@v4.6.2
        with:
          name: npu-reference
          path: npu-ref

